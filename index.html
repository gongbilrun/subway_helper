<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 열차 위치 기반 도착 타이머 & 길찾기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        * { font-family: 'Pretendard', sans-serif; }
        .autocomplete-dropdown {
            max-height: 240px;
            overflow-y: auto;
            scrollbar-width: thin;
        }
        .autocomplete-dropdown::-webkit-scrollbar { width: 4px; }
        .autocomplete-dropdown::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 9999px; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen py-4 px-3">
    <div class="max-w-md mx-auto bg-white rounded-3xl shadow-lg overflow-hidden border border-slate-200/80">

        <!-- 1. 상단 출발역 ↔ 도착역 입력 헤더 -->
        <div class="p-3.5 bg-white border-b border-slate-100 relative">
            <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2">
                <div class="flex items-center gap-1.5 flex-1 min-w-0 relative">
                    <i class="fa-solid fa-location-arrow text-emerald-500 text-xs shrink-0"></i>
                    <input type="text" id="startInput" value="백마" placeholder="출발역" autocomplete="off"
                           class="w-full text-sm font-bold text-slate-800 bg-transparent outline-none truncate">
                    <div id="startDropdown" class="autocomplete-dropdown hidden fixed sm:absolute left-0 top-10 w-64 bg-white border border-slate-200 rounded-xl shadow-2xl z-50 divide-y divide-slate-100"></div>
                </div>

                <button type="button" onclick="swapStations()" title="출발/도착 맞바꾸기"
                        class="w-7 h-7 rounded-full bg-white border border-slate-200 text-slate-400 hover:text-emerald-600 flex items-center justify-center shrink-0 transition active:scale-90">
                    <i class="fa-solid fa-right-left text-[11px]"></i>
                </button>

                <div class="flex items-center gap-1.5 flex-1 min-w-0 relative">
                    <i class="fa-solid fa-location-dot text-rose-500 text-xs shrink-0"></i>
                    <input type="text" id="destInput" value="숭실대입구" placeholder="도착역" autocomplete="off"
                           class="w-full text-sm font-bold text-slate-800 bg-transparent outline-none truncate">
                    <div id="destDropdown" class="autocomplete-dropdown hidden fixed sm:absolute right-0 top-10 w-64 bg-white border border-slate-200 rounded-xl shadow-2xl z-50 divide-y divide-slate-100"></div>
                </div>

                <button type="button" onclick="searchRoutesAndTrains()"
                        class="px-2.5 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shrink-0 transition">
                    조회
                </button>
            </div>
        </div>

        <!-- 2. 실시간 열차 후보 전환 (< 이전 열차 / > 다음 열차) -->
        <div class="px-4 py-3 bg-white border-b border-slate-100 flex items-center justify-between">
            <button type="button" onclick="shiftLiveTrainIndex(-1)" title="앞선 실시간 열차"
                    class="w-9 h-9 rounded-full border border-slate-200 bg-white hover:bg-slate-50 active:bg-slate-100 text-slate-600 flex items-center justify-center transition shadow-2xs cursor-pointer">
                <i class="fa-solid fa-chevron-left text-xs"></i>
            </button>

            <div class="text-center min-w-0 px-2">
                <div class="flex items-center justify-center gap-1.5">
                    <span id="headerDepartureText" class="text-[15px] font-extrabold text-slate-900 tracking-tight font-mono">
                        --:--:-- 탑승 예정
                    </span>
                </div>
                <div class="mt-0.5 flex items-center justify-center gap-1.5 flex-wrap">
                    <span id="trainCandidateBadge" class="text-[11px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full">
                        실시간 열차 확인 중
                    </span>
                    <button type="button" id="resetNowBtn" onclick="resetLiveTrainIndex()"
                            class="hidden text-[10px] font-bold text-indigo-600 underline hover:text-indigo-800">
                        가장 빠른 열차로
                    </button>
                </div>
            </div>

            <button type="button" onclick="shiftLiveTrainIndex(1)" title="뒤따르는 실시간 열차"
                    class="w-9 h-9 rounded-full border border-slate-200 bg-white hover:bg-slate-50 active:bg-slate-100 text-slate-600 flex items-center justify-center transition shadow-2xs cursor-pointer">
                <i class="fa-solid fa-chevron-right text-xs"></i>
            </button>
        </div>

        <!-- 3. 경로 옵션 칩 -->
        <div class="px-4 pt-3 pb-2 bg-white flex items-center gap-2 overflow-x-auto" id="routeFilterChips"></div>

        <!-- 4. 실시간 위치 & 초 단위 도착 카운트다운 카드 -->
        <div id="summarySection" class="px-4 pt-2 pb-4 bg-white border-b border-slate-100 hidden space-y-3">
            <div class="bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-950 text-white rounded-2xl p-4 shadow-md">
                <div class="flex items-center justify-between text-[11px] text-slate-300 font-semibold mb-2">
                    <span class="flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                        <span id="cardLineBadge" class="px-2 py-0.5 rounded text-white font-black text-[10px]">-</span>
                        <span id="cardTrainHeading" class="text-yellow-300 font-extrabold">-</span>
                    </span>
                    <button type="button" onclick="manualRefresh()" class="text-indigo-300 hover:text-white flex items-center gap-1 font-bold cursor-pointer">
                        <i id="refreshSpin" class="fa-solid fa-rotate-right text-[10px]"></i>
                        <span id="pollCountdownLabel">20초 뒤 갱신</span>
                    </button>
                </div>

                <div class="grid grid-cols-2 gap-2.5 mt-2">
                    <div class="bg-white/10 rounded-xl p-2.5">
                        <div class="text-[10px] text-slate-300 font-medium">승강장 도착까지</div>
                        <div id="boardRemainSecText" class="text-lg font-black text-yellow-300 font-mono mt-0.5">--분 --초</div>
                        <div class="text-[11px] text-slate-200 font-mono mt-0.5">
                            도착 <span id="boardClockText" class="font-bold">--:--:--</span>
                        </div>
                    </div>

                    <div class="bg-white/10 rounded-xl p-2.5">
                        <div class="text-[10px] text-slate-300 font-medium">실시간 열차 위치</div>
                        <div id="liveTrainLocText" class="text-sm font-extrabold text-emerald-300 mt-1 leading-snug">
                            조회 중...
                        </div>
                        <div id="liveTrainMsgText" class="text-[10px] text-slate-300 mt-0.5 truncate">
                            -
                        </div>
                    </div>
                </div>

                <div class="mt-2.5 pt-2.5 border-t border-white/10 flex items-center justify-between">
                    <div>
                        <div class="text-[10px] text-emerald-200 font-semibold">최종 목적지 도착 예정 시각</div>
                        <div id="finalArrivalClockText" class="text-xl font-black text-white font-mono">--:--:--</div>
                    </div>
                    <div class="text-right">
                        <div id="totalDurationBig" class="text-sm font-extrabold text-emerald-300">-</div>
                        <div id="finalRemainSecText" class="text-xs font-bold font-mono text-white mt-0.5">지금으로부터 --분 --초</div>
                    </div>
                </div>
            </div>

            <div id="summarySubText" class="text-xs text-slate-500 font-medium">-</div>
            <div id="segmentProgressBar"></div>
        </div>

        <!-- 5. 상세 세로 타임라인 -->
        <div id="timelineContainer" class="p-4 bg-white space-y-0"></div>

    </div>

    <!-- 역별 실시간 열차 상세 모달 -->
    <div id="scheduleModal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-end sm:items-center justify-center p-3" onclick="closeModalOnBackdrop(event)">
        <div class="bg-white w-full max-w-md rounded-3xl p-5 shadow-2xl max-h-[80vh] flex flex-col">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                <div>
                    <span id="modalLineBadge" class="px-2 py-0.5 rounded text-white text-[11px] font-bold mr-1">노선</span>
                    <span id="modalTitle" class="text-base font-black text-slate-900">역 실시간 열차</span>
                </div>
                <button type="button" onclick="closeScheduleModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 hover:text-slate-800 flex items-center justify-center">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>
            <div id="modalSubtitle" class="text-xs text-slate-500 mt-2 mb-3"></div>
            <div id="modalBody" class="overflow-y-auto space-y-2 pr-1 text-xs"></div>
        </div>
    </div>

        function getTransferWalkSeconds(station, lineA, lineB) {
            if (!lineA || !lineB || lineA === lineB) return 0;
            return TRANSFER_WALK_SEC[`${station}|${lineA}|${lineB}`] ?? TRANSFER_WALK_SEC[`${station}|${lineB}|${lineA}`] ?? 210;
        }

        function formatWalkDurationText(sec) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return s === 0 ? `약 ${m}분` : `약 ${m}분 ${s}초`;
        }

        const allStationsSet = new Set();
        const stationLinesMap = {};
        const subwayGraph = {};

        for (const [lineKey, stations] of Object.entries(RAW_LINES)) {
            const baseLine = lineKey.split('(')[0];
            if (!SUPPORTED_LINES.has(baseLine)) continue;
            for (let i = 0; i < stations.length; i++) {
                const s = stations[i];
                allStationsSet.add(s);
                if (!stationLinesMap[s]) stationLinesMap[s] = new Set();
                stationLinesMap[s].add(baseLine);

                if (!subwayGraph[s]) subwayGraph[s] = [];
                if (i > 0) subwayGraph[s].push({ neighbor: stations[i - 1], line: baseLine, time: 2.5 });
                if (i < stations.length - 1) subwayGraph[s].push({ neighbor: stations[i + 1], line: baseLine, time: 2.5 });
            }
        }
        const ALL_STATIONS = Array.from(allStationsSet).sort();

        const CHOSUNG = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
        function getChosung(str) {
            let res = '';
            for (let i = 0; i < str.length; i++) {
                const code = str.charCodeAt(i) - 44032;
                if (code >= 0 && code <= 11171) res += CHOSUNG[Math.floor(code / 588)];
                else res += str.charAt(i);
            }
            return res;
        }

        function normalizeStationName(input) {
            if (!input) return '';
            let cleaned = input.trim();
            if (STATION_ALIASES[cleaned.toLowerCase()]) return STATION_ALIASES[cleaned.toLowerCase()];
            if (cleaned.endsWith('역') && cleaned.length > 2) {
                const withoutYeok = cleaned.slice(0, -1);
                if (ALL_STATIONS.includes(withoutYeok)) cleaned = withoutYeok;
                else if (STATION_ALIASES[withoutYeok]) cleaned = STATION_ALIASES[withoutYeok];
            }
            return STATION_ALIASES[cleaned] || cleaned;
        }

        function setupAutocomplete(inputId, dropdownId) {

            inputEl.addEventListener('input', function() {

                const chosungQ = getChosung(cleanQ);

                const matches = ALL_STATIONS.filter(st =>
                    st.toLowerCase().includes(cleanQ) ||
                    getChosung(st).includes(chosungQ) ||

                if (matches.length === 0) {

                dropdownEl.innerHTML = matches.map(st => `

                        <span class="text-[10px] text-slate-400 font-medium">${Array.from(stationLinesMap[st] || []).join(', ')}</span>
                    </div>

                dropdownEl.classList.remove('hidden');
            });

            inputEl.addEventListener('keydown', (e) => {

        function formatClockHMS(dateObj) {

            const m = String(dateObj.getMinutes()).padStart(2, '0');
            const s = String(dateObj.getSeconds()).padStart(2, '0');

        }

        function formatClockHM(dateObj) {
            const h = String(dateObj.getHours()).padStart(2, '0');
            const m = String(dateObj.getMinutes()).padStart(2, '0');
            return `${h}:${m}`;
        }

        function formatRemainMinSec(totalSec) {
            const clamped = Math.max(0, Math.floor(totalSec));
            const m = Math.floor(clamped / 60);
            const s = clamped % 60;
            return `${m}분 ${String(s).padStart(2, '0')}초`;
        }

        function formatDurationKorean(totalSec) {
            const totalMin = Math.max(1, Math.round(totalSec / 60));
            const h = Math.floor(totalMin / 60);
            const m = totalMin % 60;
            return h > 0 ? `약 ${h}시간 ${m}분` : `약 ${m}분`;
        }

        function runDijkstra(startStation, destStation, forcedStartLine = null, extraTransferPenaltyMin = 1.5) {
            if (startStation === destStation) return null;
            const queue = [];
            const visited = new Map();

            const startLines = forcedStartLine ? [forcedStartLine] : Array.from(stationLinesMap[startStation] || []);
            for (const line of startLines) {
                queue.push({ station: startStation, line: line, cost: 0, path: [{ station: startStation, line: line }] });
                visited.set(`${startStation}::${line}`, 0);
            }

            let best = null;
            while (queue.length > 0) {
                queue.sort((a, b) => a.cost - b.cost);
                const cur = queue.shift();
                if (cur.station === destStation) { best = cur; break; }

                for (const edge of (subwayGraph[cur.station] || [])) {
                    const isTransfer = edge.line !== cur.line;
                    const walkMin = isTransfer ? (getTransferWalkSeconds(cur.station, cur.line, edge.line) / 60) : 0;
                    const penalty = isTransfer ? (walkMin + extraTransferPenaltyMin) : 0;
                    const newCost = cur.cost + edge.time + penalty;
                    const key = `${edge.neighbor}::${edge.line}`;

                    if (visited.has(key) && visited.get(key) <= newCost) continue;
                    visited.set(key, newCost);
                    queue.push({
                        station: edge.neighbor, line: edge.line, cost: newCost,
                        path: [...cur.path, { station: edge.neighbor, line: edge.line }]
                    });
                }
            }
            return best;
        }

        function findMultipleCandidateRoutes(startStation, destStation) {
            const candidates = [];
            const seenSignatures = new Set();

            function addCandidate(route, label) {
                if (!route) return;
                const segments = groupPathSegments(route.path);
                const signature = segments.map(s => `${s.line}:${s.from}->${s.to}`).join('|');
                if (!seenSignatures.has(signature)) {
                    seenSignatures.add(signature);
                    const rideSec = segments.reduce((acc, s) => acc + s.timeSec, 0);
                    let transferSec = 0;
                    for (let i = 0; i < segments.length - 1; i++) {
                        transferSec += getTransferWalkSeconds(segments[i].to, segments[i].line, segments[i + 1].line) + 90;
                    }
                    candidates.push({
                        label: label,
                        segments: segments,
                        totalTravelSec: rideSec + transferSec,
                        stops: route.path.length - 1,
                        transfers: segments.length - 1
                    });
                }
            }

            const rFast = runDijkstra(startStation, destStation, null, 1.5);
            if (rFast) addCandidate(rFast, "최단 시간");

            const rMinTransfer = runDijkstra(startStation, destStation, null, 22.0);
            if (rMinTransfer) addCandidate(rMinTransfer, "최소 환승");

            const startLines = Array.from(stationLinesMap[startStation] || []);
            for (const line of startLines) {
                const rLine = runDijkstra(startStation, destStation, line, 2.0);
                if (rLine) addCandidate(rLine, `${line} 출발`);
            }

            return candidates.slice(0, 4);
        }

        function groupPathSegments(rawPath) {
            if (!rawPath || rawPath.length < 2) return [];
            const segs = [];
            let curLine = rawPath[1].line;
            let curSts = [rawPath[0].station, rawPath[1].station];

            for (let i = 2; i < rawPath.length; i++) {
                if (rawPath[i].line === curLine) {
                    curSts.push(rawPath[i].station);
                } else {
                    segs.push(createSegmentInfo(curLine, curSts));
                    curLine = rawPath[i].line;
                    curSts = [rawPath[i - 1].station, rawPath[i].station];
                }
            }
            segs.push(createSegmentInfo(curLine, curSts));
            return segs;
        }

        function createSegmentInfo(line, stationsList) {
            const from = stationsList[0];
            const to = stationsList[stationsList.length - 1];
            const stops = stationsList.length - 1;
            const timeSec = Math.max(120, stops * 150);

            let directionText = '';
            let isDownwardIndex = null;
            const lineStations = RAW_LINES[line];
            if (lineStations) {
                const fIdx = lineStations.indexOf(from);
                const tIdx = lineStations.indexOf(to);
                if (fIdx !== -1 && tIdx !== -1 && fIdx !== tIdx) {
                    isDownwardIndex = tIdx > fIdx;
                    const terminalStation = isDownwardIndex ? lineStations[lineStations.length - 1] : lineStations[0];
                    directionText = `${terminalStation}행`;
                }
            }

            return {
                line: line, from: from, to: to, stops: stops,
                timeSec: timeSec, timeMin: Math.max(2, Math.round(timeSec / 60)),
                directionText: directionText, isDownwardIndex: isDownwardIndex, stations: stationsList
            };
        }

        let candidateRoutes = [];
        let selectedRouteIdx = 0;
        let liveTrainCandidates = [];
        let selectedTrainIdx = 0;
        let expandedSegments = {};

        let activeBoardTargetMs = Date.now() + 180 * 1000;
        let activeFinalTargetMs = Date.now() + 180 * 1000;
        let activeTrainSummary = null;
        let lastApiErrorNote = '';

        let secTicker = null;
        let pollTicker = null;
        let pollRemainSec = 20;
        let isPollingBusy = false;

        // API의 recptnDt("YYYY-MM-DD HH:MM:SS")를 밀리초로 변환
        function parseRecptnMs(recptnDt) {
            if (!recptnDt) return Date.now();
            const parsed = Date.parse(recptnDt.replace(' ', 'T') + '+09:00');
            return isNaN(parsed) ? Date.now() : parsed;
        }

        // recptnDt 시점 기준 남은 초(barvlDt 또는 arvlMsg2) 계산
        function parseBaseWaitSeconds(train) {
            const sec = parseInt(train.barvlDt, 10);
            if (!isNaN(sec) && sec > 0) return sec;

            const msg = train.arvlMsg2 || '';
            const mMatch = msg.match(/(\d+)\s*분/);
            const sMatch = msg.match(/(\d+)\s*초/);
            if (mMatch || sMatch) {
                return (mMatch ? parseInt(mMatch[1], 10) : 0) * 60 + (sMatch ? parseInt(sMatch[1], 10) : 0);
            }
            const stopMatch = msg.match(/\[(\d+)\]\s*번째\s*전역/);
            if (stopMatch) {
                return Math.max(40, parseInt(stopMatch[1], 10) * 145);
            }
            if (msg.includes('당역도착') || msg.includes('도착')) return 15;
            if (msg.includes('진입')) return 35;
            if (msg.includes('전역출발') || msg.includes('전역진입')) return 85;
            if (msg.includes('전역도착')) return 60;
            return 180;
        }

        // recptnDt 경과 시간을 반영한 절대 승강장 도착 시각(ms) 산출
        function computeTrainArrivalMs(train) {
            const recptnMs = parseRecptnMs(train.recptnDt);
            const baseWaitSec = parseBaseWaitSeconds(train);
            const targetMs = recptnMs + baseWaitSec * 1000;
            // 이미 지나간 수신 시각이라면 최소 10초 후로 보정
            return Math.max(Date.now() + 10000, targetMs);
        }

        function isTrainMatchingDirection(train, startStation, nextStation, targetLine, isDownwardIndex) {
            const apiLine = resolveApiLineName(train);
            if (!apiLine || apiLine !== targetLine) return false;

            const lineStations = RAW_LINES[targetLine] || [];
            const trainLineNm = (train.trainLineNm || '').replace(/\s+/g, '');
            const updn = String(train.updnLine || '').trim();

            if (nextStation && trainLineNm.includes('방면')) {
                const cleanNext = nextStation.replace(/\(.*?\)/g, '');
                if (trainLineNm.includes(`${cleanNext}방면`) || trainLineNm.includes(`${nextStation}방면`)) {
                    return true;
                }
                const sIdx = lineStations.indexOf(startStation);
                if (sIdx !== -1) {
                    const prevSt = lineStations[sIdx - 1];
                    const nextSt = lineStations[sIdx + 1];
                    const oppositeSt = (prevSt === nextStation) ? nextSt : prevSt;
                    if (oppositeSt) {
                        const cleanOpp = oppositeSt.replace(/\(.*?\)/g, '');
                        if (trainLineNm.includes(`${cleanOpp}방면`) || trainLineNm.includes(`${oppositeSt}방면`)) {
                            return false;
                        }
                    }
                }
            }

            const destName = (train.bstatnNm || train.statnTnm || '').replace(/\(.*?\)/g, '').trim();
            const sIdx = lineStations.indexOf(startStation);
            const dIdx = lineStations.findIndex(st => st.replace(/\(.*?\)/g, '') === destName);
            if (sIdx !== -1 && dIdx !== -1 && sIdx !== dIdx && isDownwardIndex !== null) {
                return isDownwardIndex ? (dIdx > sIdx) : (dIdx < sIdx);
            }

            if (isDownwardIndex !== null) {
                if (updn === '하행' || updn === '1') return isDownwardIndex === true;
                if (updn === '상행' || updn === '0') return isDownwardIndex === false;
            }
            return true;
        }

        async function fetchStationLineTrains(stationName, targetLine, nextStation, isDownwardIndex) {
            lastApiErrorNote = '';
            if (!SUPPORTED_LINES.has(targetLine)) return [];
            const cleanSt = stationName.endsWith('역') ? stationName.slice(0, -1) : stationName;

            const isLocal = ["localhost", "127.0.0.1", ""].includes(window.location.hostname);
            const url = isLocal
                ? `http://swopenAPI.seoul.go.kr/api/subway/${SEOUL_API_KEY}/json/realtimeStationArrival/0/30/${encodeURIComponent(cleanSt)}`
                : `/api/subway?station=${encodeURIComponent(cleanSt)}`;

            try {
                const res = await fetch(url);
                if (!res.ok) {
                    lastApiErrorNote = `응답 오류 (${res.status})`;
                    return [];
                }
                const data = await res.json();
                if (data.errorMessage && data.errorMessage.code && data.errorMessage.code !== 'INFO-000') {
                    lastApiErrorNote = data.errorMessage.message || data.errorMessage.code;
                    return [];
                }
                const allSupported = (data.realtimeArrivalList || []).filter(t => resolveApiLineName(t) === targetLine);
                const matched = allSupported.filter(t => isTrainMatchingDirection(t, stationName, nextStation, targetLine, isDownwardIndex));

                const mapped = matched.map(t => {
                    const arrivalMs = computeTrainArrivalMs(t);
                    return {
                        raw: t,
                        line: targetLine,
                        arrivalMs: arrivalMs,
                        heading: t.trainLineNm || (t.statnTnm ? `${t.statnTnm}행` : ''),
                        currentLoc: t.arvlMsg3 ? `${t.arvlMsg3}역` : '실시간 위치 수신',
                        statusMsg: t.arvlMsg2 || '접근 중'
                    };
                });

                mapped.sort((a, b) => a.arrivalMs - b.arrivalMs);
                return mapped;
            } catch (e) {
                lastApiErrorNote = isLocal ? '로컬 API 호출 실패' : '/api/subway 연결 실패';
                return [];
            }
        }

        async function searchRoutesAndTrains() {
            const rawStart = document.getElementById('startInput').value;
            const rawDest = document.getElementById('destInput').value;
            const startStation = normalizeStationName(rawStart);
            const destStation = normalizeStationName(rawDest);

            if (!startStation || !destStation) return alert("출발역과 도착역을 모두 입력해주세요.");
            if (!ALL_STATIONS.includes(startStation)) return alert(`'${rawStart}'역을 찾을 수 없습니다.`);
            if (!ALL_STATIONS.includes(destStation)) return alert(`'${rawDest}'역을 찾을 수 없습니다.`);
            if (startStation === destStation) return alert("출발역과 도착역이 동일합니다.");

            candidateRoutes = findMultipleCandidateRoutes(startStation, destStation);
            if (candidateRoutes.length === 0) return alert("API 지원 노선 기준 연결 경로를 찾을 수 없습니다.");

            selectedRouteIdx = 0;
            selectedTrainIdx = 0;
            expandedSegments = {};

            renderFilterChips();
            await refreshRealtimeNow();
            startAutoPoll();
        }

        function startAutoPoll() {
            if (pollTicker) clearInterval(pollTicker);
            pollRemainSec = 20;
            const labelEl = document.getElementById('pollCountdownLabel');
            if (labelEl) labelEl.innerText = `${pollRemainSec}초 뒤 갱신`;

            pollTicker = setInterval(async () => {
                if (isPollingBusy) return;
                pollRemainSec--;
                const el = document.getElementById('pollCountdownLabel');
                if (el) el.innerText = `${Math.max(0, pollRemainSec)}초 뒤 갱신`;

                if (pollRemainSec <= 0) {
                    isPollingBusy = true;
                    if (el) el.innerText = '갱신 중...';
                    await refreshRealtimeNow();
                    pollRemainSec = 20;
                    if (el) el.innerText = `${pollRemainSec}초 뒤 갱신`;
                    isPollingBusy = false;
                }
            }, 1000);
        }

        async function manualRefresh() {
            if (isPollingBusy) return;
            isPollingBusy = true;
            const spin = document.getElementById('refreshSpin');
            const el = document.getElementById('pollCountdownLabel');
            if (spin) spin.classList.add('fa-spin');
            if (el) el.innerText = '갱신 중...';
            await refreshRealtimeNow();
            pollRemainSec = 20;
            if (el) el.innerText = `${pollRemainSec}초 뒤 갱신`;
            setTimeout(() => { if (spin) spin.classList.remove('fa-spin'); }, 450);
            isPollingBusy = false;
        }

        function renderFilterChips() {
            const chipsEl = document.getElementById('routeFilterChips');
            chipsEl.innerHTML = candidateRoutes.map((cand, idx) => {
                const active = idx === selectedRouteIdx;
                return `
                    <button type="button" onclick="selectRouteChip(${idx})"
                            class="px-3.5 py-1.5 rounded-full text-xs font-bold border shrink-0 transition cursor-pointer ${
                                active
                                ? 'bg-emerald-50 text-emerald-700 border-emerald-500'
                                : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'
                            }">
                        ${cand.label} ${active ? '<i class="fa-solid fa-chevron-down text-[10px] ml-0.5"></i>' : ''}
                    </button>
                `;
            }).join('');
        }

        async function selectRouteChip(idx) {
            selectedRouteIdx = idx;
            selectedTrainIdx = 0;
            expandedSegments = {};
            renderFilterChips();
            await refreshRealtimeNow();
            pollRemainSec = 20;
        }

        function shiftLiveTrainIndex(delta) {
            if (liveTrainCandidates.length <= 1) return;
            const nextIdx = selectedTrainIdx + delta;
            if (nextIdx < 0 || nextIdx >= liveTrainCandidates.length) return;
            selectedTrainIdx = nextIdx;
            applySelectedTrainSnapshot();
        }

        function resetLiveTrainIndex() {
            selectedTrainIdx = 0;
            applySelectedTrainSnapshot();
        }

        function toggleSegmentStops(segIdx) {
            expandedSegments[segIdx] = !expandedSegments[segIdx];
            renderTimelineAndBar();
        }

        async function refreshRealtimeNow() {
            const cand = candidateRoutes[selectedRouteIdx];
            if (!cand) return;

            const firstSeg = cand.segments[0];
            const nextSt = firstSeg.stations[1] || null;
            liveTrainCandidates = await fetchStationLineTrains(firstSeg.from, firstSeg.line, nextSt, firstSeg.isDownwardIndex);

            if (selectedTrainIdx >= liveTrainCandidates.length) {
                selectedTrainIdx = 0;
            }
            applySelectedTrainSnapshot();
        }

        function applySelectedTrainSnapshot() {
            const cand = candidateRoutes[selectedRouteIdx];
            if (!cand) return;
            const firstSeg = cand.segments[0];
            const col = LINE_COLORS[firstSeg.line] || { bg: '#334155', short: '전' };

            document.getElementById('summarySection').classList.remove('hidden');

            const badgeEl = document.getElementById('cardLineBadge');
            badgeEl.innerText = firstSeg.line;
            badgeEl.style.backgroundColor = col.bg;

            const resetBtn = document.getElementById('resetNowBtn');
            const candBadge = document.getElementById('trainCandidateBadge');

            if (liveTrainCandidates.length > 0) {
                const chosen = liveTrainCandidates[selectedTrainIdx];
                activeTrainSummary = chosen;
                activeBoardTargetMs = chosen.arrivalMs;
                activeFinalTargetMs = activeBoardTargetMs + cand.totalTravelSec * 1000;

                document.getElementById('cardTrainHeading').innerText = chosen.heading || firstSeg.directionText || '운행 중';
                document.getElementById('liveTrainLocText').innerText = chosen.currentLoc;
                document.getElementById('liveTrainMsgText').innerText = chosen.statusMsg;

                candBadge.innerText = `실시간 ${selectedTrainIdx + 1}/${liveTrainCandidates.length}번째 열차`;
                candBadge.className = 'text-[11px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full';
                if (selectedTrainIdx > 0) resetBtn.classList.remove('hidden');
                else resetBtn.classList.add('hidden');
            } else {
                activeTrainSummary = null;
                activeBoardTargetMs = Date.now() + 180 * 1000;
                activeFinalTargetMs = activeBoardTargetMs + cand.totalTravelSec * 1000;

                document.getElementById('cardTrainHeading').innerText = firstSeg.directionText || `${firstSeg.line} 열차`;
                document.getElementById('liveTrainLocText').innerText = '운행 열차 대기 중';
                document.getElementById('liveTrainMsgText').innerText = lastApiErrorNote || '해당 방향 접근 열차 없음';

                candBadge.innerText = lastApiErrorNote ? lastApiErrorNote : '접근 중인 실시간 열차 없음';
                candBadge.className = 'text-[11px] font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded-full';
                resetBtn.classList.add('hidden');
            }

            document.getElementById('totalDurationBig').innerText = formatDurationKorean(cand.totalTravelSec);
            document.getElementById('summarySubText').innerText =
                `이동·환승 약 ${Math.round(cand.totalTravelSec / 60)}분 · 환승 ${cand.transfers}회 · ${cand.stops}개 역`;

            renderTimelineAndBar();
            startSecondTicker();
        }

        function startSecondTicker() {
            if (secTicker) clearInterval(secTicker);
            const updateSecUI = () => {
                const now = Date.now();
                const boardRemainSec = Math.max(0, Math.floor((activeBoardTargetMs - now) / 1000));
                const finalRemainSec = Math.max(0, Math.floor((activeFinalTargetMs - now) / 1000));

                const boardDate = new Date(activeBoardTargetMs);
                const finalDate = new Date(activeFinalTargetMs);

                document.getElementById('headerDepartureText').innerText = `${formatClockHMS(boardDate)} 탑승 예정`;
                document.getElementById('boardRemainSecText').innerText =
                    boardRemainSec === 0 ? '지금 도착' : `${formatRemainMinSec(boardRemainSec)} 남음`;
                document.getElementById('boardClockText').innerText = formatClockHMS(boardDate);

                document.getElementById('finalArrivalClockText').innerText = formatClockHMS(finalDate);
                document.getElementById('finalRemainSecText').innerText =
                    finalRemainSec === 0 ? '도착 예정 시각' : `지금으로부터 ${formatRemainMinSec(finalRemainSec)}`;
            };
            updateSecUI();
            secTicker = setInterval(updateSecUI, 1000);
        }

        function computeSegmentTimes() {
            const cand = candidateRoutes[selectedRouteIdx];
            if (!cand) return [];
            let cursorMs = activeBoardTargetMs;
            return cand.segments.map((seg, idx) => {
                if (idx > 0) {
                    const prevSeg = cand.segments[idx - 1];
                    const walkSec = getTransferWalkSeconds(seg.from, prevSeg.line, seg.line);
                    cursorMs += (walkSec + 90) * 1000;
                }
                const boardMs = cursorMs;
                const alightMs = boardMs + seg.timeSec * 1000;
                cursorMs = alightMs;

                const heading = (idx === 0 && activeTrainSummary && activeTrainSummary.heading)
                    ? activeTrainSummary.heading
                    : seg.directionText;

                const nextSeg = cand.segments[idx + 1];
                const walkAfterSec = nextSeg ? getTransferWalkSeconds(seg.to, seg.line, nextSeg.line) : 0;

                return {
                    segIdx: idx, seg: seg, boardDate: new Date(boardMs), alightDate: new Date(alightMs),
                    heading: heading, walkAfterSec: walkAfterSec, walkAfterMin: Math.max(1, Math.round(walkAfterSec / 60))
                };
            });
        }

        function renderTimelineAndBar() {
            const steps = computeSegmentTimes();
            if (steps.length === 0) return;

            const totalSec = Math.max(1, (steps[steps.length - 1].alightDate.getTime() - steps[0].boardDate.getTime()) / 1000);

            let barHtml = `<div class="flex items-center w-full h-5 rounded-full overflow-hidden bg-slate-100 text-[10px] font-bold">`;
            steps.forEach((st, idx) => {
                const col = LINE_COLORS[st.seg.line] || { bg: '#64748b', short: '전' };
                const widthPct = Math.max(16, Math.round((st.seg.timeSec / totalSec) * 100));
                if (idx > 0) {
                    const prevWalkMin = steps[idx - 1].walkAfterMin;
                    barHtml += `<div class="h-full bg-slate-200 text-slate-600 flex items-center justify-center px-1.5 shrink-0">${prevWalkMin}분</div>`;
                }
                barHtml += `
                    <div style="width: ${widthPct}%; background-color: ${col.bg};"
                         class="h-full text-white flex items-center justify-between px-1.5 min-w-[44px]">
                        <span class="w-3.5 h-3.5 rounded-full bg-white/25 flex items-center justify-center text-[9px] shrink-0">${col.short}</span>
                        <span class="truncate ml-1">${st.seg.timeMin}분</span>
                    </div>
                `;
            });
            barHtml += `</div>`;

            let labelHtml = `<div class="flex items-center justify-between text-[10px] text-slate-500 font-semibold mt-1 px-0.5">`;
            steps.forEach((st) => {
                const col = LINE_COLORS[st.seg.line] || { bg: '#64748b' };
                labelHtml += `
                    <div class="truncate">
                        <div class="font-mono text-slate-400">${formatClockHM(st.boardDate)}</div>
                        <div style="color: ${col.bg};" class="font-bold truncate">${st.seg.from}역</div>
                    </div>
                `;
            });
            const lastSt = steps[steps.length - 1];
            labelHtml += `
                <div class="text-right shrink-0">
                    <div class="font-mono text-slate-400">${formatClockHM(lastSt.alightDate)}</div>
                    <div class="font-bold text-slate-700">${lastSt.seg.to}역</div>
                </div>
            </div>`;
            document.getElementById('segmentProgressBar').innerHTML = barHtml + labelHtml;

            let html = '';
            steps.forEach((st, idx) => {
                const seg = st.seg;
                const col = LINE_COLORS[seg.line] || { bg: '#64748b' };
                const isLast = idx === steps.length - 1;
                const isExpanded = !!expandedSegments[idx];
                const midStations = seg.stations.slice(1, -1);

                html += `
                    <div class="flex gap-3">
                        <div class="w-14 text-right shrink-0 pt-0.5">
                            <span class="text-xs font-extrabold font-mono text-slate-800">${formatClockHM(st.boardDate)}</span>
                        </div>
                        <div class="flex flex-col items-center shrink-0">
                            <div style="border-color: ${col.bg}; color: ${col.bg};"
                                 class="w-6 h-6 rounded-full border-2 bg-white flex items-center justify-center text-[11px] font-black z-10">
                                <i class="fa-solid fa-train-subway"></i>
                            </div>
                            <div style="background-color: ${col.bg};" class="w-1.5 flex-1 min-h-[72px] -my-0.5"></div>
                        </div>
                        <div class="flex-1 pb-4 min-w-0">
                            <div class="flex items-center justify-between gap-2">
                                <button type="button" onclick="openStationLiveModal(${idx})"
                                        class="text-left text-sm font-extrabold flex items-center gap-1 hover:underline cursor-pointer truncate">
                                    <span style="color: ${col.bg};">${seg.line}</span>
                                    <span class="text-slate-900">${seg.from}역</span>
                                    <i class="fa-solid fa-chevron-right text-[10px] text-slate-400"></i>
                                </button>
                                <button type="button" onclick="openStationLiveModal(${idx})"
                                        class="px-2 py-0.5 rounded border border-emerald-300 bg-emerald-50 text-emerald-700 text-[11px] font-bold hover:bg-emerald-100 cursor-pointer shrink-0">
                                    실시간 위치
                                </button>
                            </div>
                            <div class="text-xs text-slate-600 font-medium mt-1">${st.heading}</div>
                            <div class="mt-2">
                                <button type="button" onclick="toggleSegmentStops(${idx})"
                                        class="text-xs text-slate-500 hover:text-slate-800 font-semibold flex items-center gap-1 cursor-pointer">
                                    <span>${seg.stops}개 역 이동 · <strong>${seg.timeMin}분</strong></span>
                                    <i class="fa-solid fa-chevron-${isExpanded ? 'up' : 'down'} text-[10px]"></i>
                                </button>
                                ${isExpanded && midStations.length > 0 ? `
                                    <div class="mt-1.5 pl-2.5 border-l-2 border-slate-200 space-y-1 py-1">
                                        ${midStations.map(ms => `<div class="text-[11px] text-slate-500">${ms}역</div>`).join('')}
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;

                if (!isLast) {
                    const nextLine = steps[idx + 1].seg.line;
                    html += `
                        <div class="flex gap-3">
                            <div class="w-14 text-right shrink-0 pt-0.5">
                                <span class="text-xs font-bold font-mono text-slate-500">${formatClockHM(st.alightDate)}</span>
                            </div>
                            <div class="flex flex-col items-center shrink-0">
                                <div class="w-6 h-6 rounded-full border border-slate-300 bg-white text-slate-500 flex items-center justify-center text-[11px] z-10">
                                    <i class="fa-solid fa-person-walking"></i>
                                </div>
                                <div class="w-0.5 flex-1 min-h-[40px] border-l-2 border-dotted border-slate-300 my-0.5"></div>
                            </div>
                            <div class="flex-1 pb-3">
                                <div class="text-sm font-extrabold text-slate-900">${seg.to}역</div>
                                <div class="text-xs text-slate-500 mt-0.5">
                                    ${seg.line} → ${nextLine} 환승 도보 <strong class="text-slate-700">${formatWalkDurationText(st.walkAfterSec)}</strong>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="flex gap-3">
                            <div class="w-14 text-right shrink-0 pt-0.5">
                                <span class="text-xs font-extrabold font-mono text-rose-600">${formatClockHM(st.alightDate)}</span>
                            </div>
                            <div class="flex flex-col items-center shrink-0">
                                <div class="w-6 h-6 rounded-full bg-rose-500 text-white flex items-center justify-center text-[11px] z-10">
                                    <i class="fa-solid fa-flag-checkered"></i>
                                </div>
                            </div>
                            <div class="flex-1 pt-0.5">
                                <div class="text-sm font-black text-slate-900">${seg.to}역 도착</div>
                            </div>
                        </div>
                    `;
                }
            });

            document.getElementById('timelineContainer').innerHTML = html;
        }

        async function openStationLiveModal(segIdx) {
            const cand = candidateRoutes[selectedRouteIdx];
            if (!cand || !cand.segments[segIdx]) return;
            const seg = cand.segments[segIdx];
            const col = LINE_COLORS[seg.line] || { bg: '#4338ca' };

            const modal = document.getElementById('scheduleModal');
            const badge = document.getElementById('modalLineBadge');
            badge.innerText = seg.line;
            badge.style.backgroundColor = col.bg;

            document.getElementById('modalTitle').innerText = `${seg.from}역 실시간 열차`;
            document.getElementById('modalSubtitle').innerText = `${seg.line} · ${seg.directionText || ''} 실시간 위치 및 남은 시간`;
            document.getElementById('modalBody').innerHTML = `<div class="py-6 text-center text-slate-400">실시간 열차 위치 조회 중...</div>`;
            modal.classList.remove('hidden');

            const nextSt = seg.stations[1] || null;
            const trains = await fetchStationLineTrains(seg.from, seg.line, nextSt, seg.isDownwardIndex);
            const now = Date.now();

            if (trains.length === 0) {
                document.getElementById('modalBody').innerHTML =
                    `<div class="py-6 text-center text-slate-400">${lastApiErrorNote || '현재 해당 노선·방향의 실시간 수신 열차가 없습니다.'}</div>`;
                return;
            }

            document.getElementById('modalBody').innerHTML = trains.map((tr, i) => {
                const etaDate = new Date(tr.arrivalMs);
                const remainSec = Math.max(0, Math.floor((tr.arrivalMs - now) / 1000));
                return `
                    <div class="flex items-center justify-between p-3 rounded-xl border ${i === 0 ? 'bg-emerald-50 border-emerald-300' : 'bg-slate-50 border-slate-200'}">
                        <div class="min-w-0">
                            <div class="font-bold text-slate-900 truncate">${tr.heading}</div>
                            <div class="text-[11px] text-slate-500 mt-0.5">위치: <strong>${tr.currentLoc}</strong> · ${tr.statusMsg}</div>
                        </div>
                        <div class="text-right shrink-0 ml-2">
                            <div class="font-mono font-black text-sm text-indigo-700">${formatClockHMS(etaDate)}</div>
                            <div class="font-mono font-bold text-[11px] text-emerald-700">${formatRemainMinSec(remainSec)} 남음</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function closeScheduleModal() {
            document.getElementById('scheduleModal').classList.add('hidden');
        }

        function closeModalOnBackdrop(e) {
            if (e.target.id === 'scheduleModal') closeScheduleModal();
        }

        window.addEventListener('DOMContentLoaded', () => {
            setupAutocomplete('startInput', 'startDropdown');
            setupAutocomplete('destInput', 'destDropdown');
            searchRoutesAndTrains();
        });
    </script>
</body>
</html>
